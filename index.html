<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>The Realms</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #090806;

            color: #d8ccb8;

            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            overflow-x: hidden;
        }


        /* ==================================================
           ОБЩЕЕ
        ================================================== */

        .screen {

            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            background: #090806;

            overflow: hidden;
        }


        /* ==================================================
           ПЕРВЫЙ ЭКРАН
        ================================================== */

        #introScreen {

            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }


        #background {

            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;

            user-select: none;
            -webkit-user-drag: none;
        }


        /* ==================================================
           ПРОЗРАЧНАЯ КНОПКА НА КАРТИНКЕ
        ================================================== */

        #startButton {

            position: absolute;

            top: 87%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 46%;
            height: 6.5%;

            border: none;
            outline: none;

            background: transparent;

            cursor: pointer;

            padding: 0;
        }


        #startButton:active {

            transform:
                translate(-50%, -50%)
                scale(0.97);
        }


        /* ==================================================
           ЭКРАН СОЗДАНИЯ ДОМА
        ================================================== */

        #creationScreen {

            display: none;

            min-height: 100vh;
            min-height: 100dvh;

            padding: 28px 22px 35px;

            overflow-y: auto;

            background:

                radial-gradient(
                    ellipse at top,
                    rgba(119, 91, 49, 0.10),
                    transparent 45%
                ),

                #090806;
        }


        /* ==================================================
           РАМКА
        ================================================== */

        .creationFrame {

            position: relative;

            min-height: calc(100vh - 63px);
            min-height: calc(100dvh - 63px);

            padding: 30px 22px 32px;

            border:
                1px solid
                rgba(157, 126, 72, 0.55);

            background:
                rgba(12, 10, 8, 0.35);
        }


        .creationFrame::before {

            content: "";

            position: absolute;

            inset: 6px;

            border:
                1px solid
                rgba(117, 94, 56, 0.25);

            pointer-events: none;
        }


        /* ==================================================
           ЗАГОЛОВОК
        ================================================== */

        .creationHeader {

            position: relative;

            z-index: 2;

            text-align: center;

            margin-bottom: 27px;
        }


        .smallCrown {

            color: #a88a55;

            font-size: 24px;

            margin-bottom: 13px;
        }


        .creationTitle {

            margin: 0;

            color: #ded2bd;

            font-size: 24px;

            font-weight: normal;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        .creationSubtitle {

            margin-top: 12px;

            color: #8d806c;

            font-size: 14px;

            line-height: 1.5;
        }


        .goldDivider {

            display: flex;

            align-items: center;

            gap: 9px;

            margin: 19px auto 0;

            width: 190px;
        }


        .goldDivider span {

            flex: 1;

            height: 1px;

            background:
                rgba(157, 126, 72, 0.55);
        }


        .goldDiamond {

            color: #ae8d55;

            font-size: 9px;
        }


        /* ==================================================
           ФОРМА
        ================================================== */

        .form {

            position: relative;

            z-index: 2;
        }


        .field {

            margin-bottom: 19px;
        }


        .fieldLabel {

            display: block;

            margin-bottom: 8px;

            color: #a99168;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        .fieldHint {

            display: block;

            margin-top: 6px;

            color: #61594e;

            font-size: 11px;
        }


        .input {

            width: 100%;

            min-height: 48px;

            padding: 12px 14px;

            border:
                1px solid
                rgba(133, 108, 68, 0.55);

            outline: none;

            background:
                rgba(28, 23, 18, 0.72);

            color: #d9cdb9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;

            border-radius: 0;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }


        .input:focus {

            border-color:
                rgba(181, 150, 91, 0.9);

            background:
                rgba(38, 31, 23, 0.85);
        }


        .input::placeholder {

            color: #5e574d;
        }


        textarea.input {

            min-height: 80px;

            resize: none;
        }


        /* ==================================================
           ГЕРБ
        ================================================== */

        .crestUpload {

            display: flex;

            align-items: center;

            gap: 16px;

            padding: 14px;

            border:
                1px solid
                rgba(133, 108, 68, 0.45);

            background:
                rgba(25, 21, 17, 0.65);
        }


        .crestPreview {

            flex-shrink: 0;

            width: 64px;
            height: 64px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border:
                1px solid
                rgba(163, 132, 77, 0.55);

            background:
                #0c0a08;

            color: #776448;

            font-size: 25px;
        }


        .crestPreview img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        .uploadArea {

            flex: 1;
        }


        .uploadButton {

            display: inline-block;

            padding: 10px 13px;

            border:
                1px solid
                rgba(153, 122, 70, 0.65);

            color: #c5b28f;

            font-size: 11px;

            letter-spacing: 1.5px;

            cursor: pointer;
        }


        #crestInput {

            display: none;
        }


        /* ==================================================
           КНОПКА
        ================================================== */

        .continueButton {

            width: 100%;

            min-height: 57px;

            margin-top: 11px;

            border:
                1px solid
                rgba(174, 141, 82, 0.75);

            outline: none;

            background:
                rgba(34, 28, 21, 0.9);

            color: #d5c4a5;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 12px;

            letter-spacing: 3px;

            cursor: pointer;
        }


        .continueButton:active {

            background:
                rgba(74, 58, 35, 0.8);

            transform: scale(0.99);
        }


        /* ==================================================
           НИЖНИЙ ТЕКСТ
        ================================================== */

        .creationFooter {

            margin-top: 23px;

            text-align: center;

            color: #5e574d;

            font-size: 10px;

            letter-spacing: 2px;
        }


        /* ==================================================
           ОШИБКА
        ================================================== */

        .error {

            display: none;

            margin-top: 12px;

            padding: 10px;

            border:
                1px solid
                rgba(140, 73, 55, 0.5);

            color: #b98570;

            background:
                rgba(80, 38, 28, 0.18);

            font-size: 12px;

            text-align: center;
        }


        /* ==================================================
           ЭКРАН БЛОКИРОВКИ
        ================================================== */

        #locked {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            background: #090806;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        .lockedContent {

            padding: 30px;

            max-width: 320px;
        }


        .lockedIcon {

            margin-bottom: 20px;

            color: #a48755;

            font-size: 42px;
        }


        .lockedTitle {

            color: #d5c8b2;

            font-size: 17px;

            letter-spacing: 3px;
        }


        .lockedText {

            margin-top: 15px;

            color: #777064;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ==================================================
           ФИНАЛЬНЫЙ ЭКРАН
        ================================================== */

        #finalScreen {

            display: none;

            min-height: 100vh;
            min-height: 100dvh;

            padding: 30px;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        .finalTitle {

            color: #d9ccb7;

            font-size: 23px;

            letter-spacing: 3px;
        }


        .finalText {

            margin-top: 15px;

            color: #918675;

            font-size: 15px;

            line-height: 1.6;
        }


        /* ==================================================
           АДАПТАЦИЯ ДЛЯ НЕБОЛЬШИХ ТЕЛЕФОНОВ
        ================================================== */

        @media (max-height: 700px) {

            #creationScreen {

                padding-top: 16px;
            }

            .creationFrame {

                padding-top: 22px;
            }

            .creationHeader {

                margin-bottom: 20px;
            }

            .field {

                margin-bottom: 14px;
            }

            .input {

                min-height: 44px;
            }

            textarea.input {

                min-height: 65px;
            }
        }

    </style>

</head>


<body>


    <!-- ==================================================
         ЭКРАН 1 — ЗАСТАВКА
    ================================================== -->

    <main id="introScreen">

        <img
            id="background"
            src="intro.jpg"
            alt="The Realms"
        >

        <button
            id="startButton"
            aria-label="Начать летопись"
            onclick="openCreation()"
        ></button>

    </main>


    <!-- ==================================================
         ЭКРАН 2 — СОЗДАНИЕ ДОМА
    ================================================== -->

    <main
        id="creationScreen"
        class="screen"
    >

        <div class="creationFrame">


            <header class="creationHeader">

                <div class="smallCrown">
                    ♜
                </div>

                <h1 class="creationTitle">
                    Акт основания
                </h1>

                <div class="creationSubtitle">
                    Так начинается история вашего Дома.
                </div>

                <div class="goldDivider">

                    <span></span>

                    <div class="goldDiamond">
                        ◆
                    </div>

                    <span></span>

                </div>

            </header>


            <form
                class="form"
                onsubmit="saveHouse(event)"
            >


                <!-- ПРАВИТЕЛЬ -->

                <div class="field">

                    <label
                        class="fieldLabel"
                        for="rulerName"
                    >
                        Имя правителя
                    </label>

                    <input
                        class="input"
                        id="rulerName"
                        type="text"
                        maxlength="40"
                        placeholder="Например, Эддард"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ДОМ -->

                <div class="field">

                    <label
                        class="fieldLabel"
                        for="houseName"
                    >
                        Название Дома
                    </label>

                    <input
                        class="input"
                        id="houseName"
                        type="text"
                        maxlength="40"
                        placeholder="Например, Дом Вальд"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ГОСУДАРСТВО -->

                <div class="field">

                    <label
                        class="fieldLabel"
                        for="realmName"
                    >
                        Название государства
                    </label>

                    <input
                        class="input"
                        id="realmName"
                        type="text"
                        maxlength="45"
                        placeholder="Например, Северные земли"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ДЕВИЗ -->

                <div class="field">

                    <label
                        class="fieldLabel"
                        for="motto"
                    >
                        Девиз Дома
                    </label>

                    <input
                        class="input"
                        id="motto"
                        type="text"
                        maxlength="80"
                        placeholder="Например, Земля помнит каждого"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ГЕРБ -->

                <div class="field">

                    <label class="fieldLabel">
                        Герб Дома
                    </label>

                    <div class="crestUpload">

                        <div
                            class="crestPreview"
                            id="crestPreview"
                        >
                            ♜
                        </div>

                        <div class="uploadArea">

                            <label
                                class="uploadButton"
                                for="crestInput"
                            >
                                ВЫБРАТЬ ГЕРБ
                            </label>

                            <input
                                id="crestInput"
                                type="file"
                                accept="image/*"
                                onchange="previewCrest(event)"
                            >

                            <span class="fieldHint">
                                Можно загрузить изображение с телефона.
                            </span>

                        </div>

                    </div>

                </div>


                <!-- ОПИСАНИЕ -->

                <div class="field">

                    <label
                        class="fieldLabel"
                        for="description"
                    >
                        История Дома
                    </label>

                    <textarea
                        class="input"
                        id="description"
                        maxlength="300"
                        placeholder="Расскажите, с чего началась история вашего Дома..."
                    ></textarea>

                </div>


                <div
                    id="error"
                    class="error"
                >
                    Заполните обязательные поля.
                </div>


                <button
                    class="continueButton"
                    type="submit"
                >
                    СОЗДАТЬ ЛЕТОПИСЬ
                </button>


            </form>


            <div class="creationFooter">
                ГОД I · НАЧАЛО ДИНАСТИИ
            </div>


        </div>

    </main>


    <!-- ==================================================
         ФИНАЛЬНЫЙ ЭКРАН
    ================================================== -->

    <main
        id="finalScreen"
        class="screen"
    >

        <div>

            <div class="finalTitle">
                ЛЕТОПИСЬ НАЧАТА
            </div>

            <div class="finalText">
                Ваш Дом основан.<br>
                Теперь начинается история.
            </div>

        </div>

    </main>


    <!-- ==================================================
         ЗАКРЫТЫЙ ДОСТУП
    ================================================== -->

    <section id="locked">

        <div class="lockedContent">

            <div class="lockedIcon">
                ♜
            </div>

            <div class="lockedTitle">
                ЗАКРЫТОЕ ТЕСТИРОВАНИЕ
            </div>

            <div class="lockedText">
                Эта летопись ещё не открыта
                для других правителей.
            </div>

        </div>

    </section>


    <script>


        /* ==================================================
           TELEGRAM
        ================================================== */

        const tg =
            window.Telegram.WebApp;

        tg.ready();

        tg.expand();


        /* ==================================================
           ДОСТУП
        ================================================== */

        const user =
            tg.initDataUnsafe.user;

        const ALLOWED_USER_ID =
            8608712290;


        if (
            !user ||
            Number(user.id) !== ALLOWED_USER_ID
        ) {

            document
                .getElementById("introScreen")
                .style.display = "none";

            document
                .getElementById("creationScreen")
                .style.display = "none";

            document
                .getElementById("locked")
                .style.display = "flex";
        }


        /* ==================================================
           ОТКРЫТЬ СОЗДАНИЕ ДОМА
        ================================================== */

        function openCreation() {

            document
                .getElementById("introScreen")
                .style.display = "none";

            document
                .getElementById("creationScreen")
                .style.display = "block";

            window.scrollTo(0, 0);

        }


        /* ==================================================
           ПРЕДПРОСМОТР ГЕРБА
        ================================================== */

        function previewCrest(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function(e) {

                    document
                        .getElementById("crestPreview")
                        .innerHTML =
                        `<img src="${e.target.result}" alt="Герб">`;

                };

            reader.readAsDataURL(file);

        }


        /* ==================================================
           СОХРАНЕНИЕ ДОМА
        ================================================== */

        function saveHouse(event) {

            event.preventDefault();


            const rulerName =
                document
                    .getElementById("rulerName")
                    .value
                    .trim();

            const houseName =
                document
                    .getElementById("houseName")
                    .value
                    .trim();

            const realmName =
                document
                    .getElementById("realmName")
                    .value
                    .trim();

            const motto =
                document
                    .getElementById("motto")
                    .value
                    .trim();

            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            if (
                !rulerName ||
                !houseName ||
                !realmName ||
                !motto
            ) {

                document
                    .getElementById("error")
                    .style.display = "block";

                return;
            }


            const house = {

                rulerName:
                    rulerName,

                houseName:
                    houseName,

                realmName:
                    realmName,

                motto:
                    motto,

                description:
                    description,

                createdAt:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "theRealmsHouse",
                JSON.stringify(house)
            );


            /* ------------------------------------------
               Переходим дальше
            ------------------------------------------ */

            document
                .getElementById("creationScreen")
                .style.display = "none";

            document
                .getElementById("finalScreen")
                .style.display = "flex";

        }


    </script>


</body>

</html>
