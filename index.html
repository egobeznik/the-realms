<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>The Realms</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #090806;
    color: #d8ccb8;
    font-family: "Cormorant Garamond", Georgia, serif;
}

body {
    overflow-x: hidden;
}


/* =====================================================
   ПЕРВЫЙ ЭКРАН
===================================================== */

#introScreen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}

#background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
}

#startButton {
    position: absolute;
    left: 50%;
    top: 87%;
    transform: translate(-50%, -50%);
    width: 52%;
    height: 8%;
    border: none;
    outline: none;
    background: transparent;
    cursor: pointer;
}

#startButton:active {
    transform: translate(-50%, -50%) scale(0.97);
}


/* =====================================================
   ВТОРОЙ ЭКРАН
===================================================== */

#creationScreen {
    display: none;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 22px 18px 30px;
    overflow-y: auto;

    background-image:
        linear-gradient(
            rgba(8, 7, 5, 0.28),
            rgba(8, 7, 5, 0.28)
        ),
        url("creation-bg.jpg");

    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}

.creationFrame {
    position: relative;
    min-height: calc(100vh - 52px);
    min-height: calc(100dvh - 52px);
    padding: 24px 18px 28px;
    border: 1px solid rgba(157, 126, 72, 0.55);
    background: rgba(7, 6, 5, 0.20);
}

.creationFrame::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(117, 94, 56, 0.25);
    pointer-events: none;
}

.creationHeader {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 20px;
}

.smallCrown {
    color: #aa8b55;
    font-size: 20px;
    margin-bottom: 8px;
}

.creationTitle {
    margin: 0;
    color: #ddd1bd;
    font-family: "Cinzel", Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.creationSubtitle {
    margin-top: 7px;
    color: #958773;
    font-size: 14px;
    line-height: 1.35;
}

.goldDivider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 13px auto 0;
    width: 170px;
}

.goldDivider span {
    flex: 1;
    height: 1px;
    background: rgba(157, 126, 72, 0.55);
}

.goldDiamond {
    color: #ad8b52;
    font-size: 7px;
}

.form {
    position: relative;
    z-index: 2;
}

.field {
    margin-bottom: 14px;
}

.fieldLabel {
    display: block;
    margin-bottom: 6px;
    color: #a89167;
    font-family: "Cinzel", Georgia, serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.fieldHint {
    display: block;
    margin-top: 5px;
    color: #665d51;
    font-size: 11px;
}

.input {
    width: 100%;
    min-height: 43px;
    padding: 9px 12px;
    border: 1px solid rgba(133, 108, 68, 0.55);
    outline: none;
    border-radius: 0;
    background: rgba(24, 20, 16, 0.78);
    color: #d8ccb9;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 16px;
}

.input:focus {
    border-color: rgba(181, 150, 91, 0.9);
    background: rgba(35, 29, 22, 0.88);
}

.input::placeholder {
    color: #625a50;
}

textarea.input {
    min-height: 72px;
    resize: none;
}

.crestUpload {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px;
    border: 1px solid rgba(133, 108, 68, 0.45);
    background: rgba(25, 21, 17, 0.72);
}

.crestPreview {
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(163, 132, 77, 0.55);
    background: #0c0a08;
    color: #776448;
    font-size: 23px;
}

.crestPreview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.uploadArea {
    flex: 1;
}

.uploadButton {
    display: inline-block;
    padding: 8px 11px;
    border: 1px solid rgba(153, 122, 70, 0.65);
    color: #c5b28f;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    letter-spacing: 1.5px;
    cursor: pointer;
}

#crestInput {
    display: none;
}

.continueButton {
    width: 100%;
    min-height: 53px;
    margin-top: 8px;
    border: 1px solid rgba(174, 141, 82, 0.75);
    outline: none;
    background: rgba(30, 25, 19, 0.90);
    color: #d5c4a5;
    font-family: "Cinzel", Georgia, serif;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
}

.continueButton:active {
    background: rgba(74, 58, 35, 0.8);
    transform: scale(0.99);
}

.error {
    display: none;
    margin-top: 10px;
    padding: 8px;
    border: 1px solid rgba(140, 73, 55, 0.5);
    color: #b98570;
    background: rgba(80, 38, 28, 0.18);
    font-size: 12px;
    text-align: center;
}

.creationFooter {
    margin-top: 17px;
    text-align: center;
    color: #665d51;
    font-family: "Cinzel", Georgia, serif;
    font-size: 8px;
    letter-spacing: 2px;
}


/* =====================================================
   ТРЕТИЙ ЭКРАН
===================================================== */

#realmScreen {
    display: none;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px 14px 30px;
    overflow-y: auto;

    background:
        radial-gradient(
            ellipse at top,
            rgba(119, 91, 49, 0.12),
            transparent 42%
        ),
        #090806;
}

.realmFrame {
    position: relative;
    width: 100%;
    min-height: calc(100vh - 46px);
    min-height: calc(100dvh - 46px);
    padding: 20px 14px 28px;
    border: 1px solid rgba(157, 126, 72, 0.55);
    background: rgba(12, 10, 8, 0.52);
}

.realmFrame::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(117, 94, 56, 0.25);
    pointer-events: none;
}


/* =====================================================
   ВЕРХ ГОСУДАРСТВА
===================================================== */

.realmCrest {
    position: relative;
    z-index: 2;
    width: 72px;
    height: 72px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(174, 143, 87, 0.65);
    background: #0b0907;
    color: #b99b63;
    font-size: 28px;
}

.realmCrest img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.realmHouse {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #e1d5c0;
    font-family: "Cinzel", Georgia, serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 2.5px;
    line-height: 1.2;
}

.realmCountry {
    position: relative;
    z-index: 2;
    margin-top: 5px;
    text-align: center;
    color: #a68b5d;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.realmMotto {
    position: relative;
    z-index: 2;
    max-width: 320px;
    margin: 12px auto 15px;
    color: #9b8e7b;
    text-align: center;
    font-size: 14px;
    font-style: italic;
    line-height: 1.35;
}

.realmDivider {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 180px;
    margin: 0 auto 15px;
}

.realmDivider span {
    flex: 1;
    height: 1px;
    background: rgba(157, 126, 72, 0.45);
}

.realmDivider div {
    color: #ae8d55;
    font-size: 7px;
}

.realmYear {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #a99168;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    letter-spacing: 4px;
}


/* =====================================================
   СЕКЦИИ
===================================================== */

.realmSection {
    position: relative;
    z-index: 2;
    margin-top: 18px;
    border: 1px solid rgba(117, 94, 56, 0.45);
    background: rgba(21, 18, 14, 0.72);
}

.sectionHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 13px;
    border-bottom: 1px solid rgba(117, 94, 56, 0.35);
}

.sectionTitle {
    color: #bca57b;
    font-family: "Cinzel", Georgia, serif;
    font-size: 10px;
    letter-spacing: 2px;
}

.sectionTotal {
    color: #817668;
    font-size: 11px;
}


/* =====================================================
   НАСЕЛЕНИЕ
===================================================== */

.populationRow {
    display: grid;
    grid-template-columns: 34px 1fr auto 32px;
    align-items: center;
    gap: 7px;
    min-height: 58px;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(117, 94, 56, 0.18);
}

.populationRow:last-child {
    border-bottom: none;
}

.populationIcon {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(117, 94, 56, 0.4);
    color: #aa9162;
    font-size: 14px;
}

.populationInfo {
    min-width: 0;
}

.populationName {
    color: #c8baa2;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    letter-spacing: 0.8px;
    line-height: 1.2;
}

.populationConsumption {
    margin-top: 3px;
    color: #665f54;
    font-size: 10px;
}

.populationValue {
    min-width: 28px;
    color: #d1c3a9;
    font-family: "Cinzel", Georgia, serif;
    font-size: 16px;
    text-align: center;
}

.helpButton {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid rgba(142, 116, 70, 0.55);
    background: rgba(36, 29, 21, 0.75);
    color: #b29667;
    font-family: Georgia, serif;
    font-size: 13px;
    cursor: pointer;
}

.helpButton:active {
    background: rgba(91, 68, 38, 0.75);
    transform: scale(0.94);
}

.populationActions {
    display: flex;
    gap: 4px;
    padding: 7px 10px 9px;
    background: rgba(12, 10, 8, 0.28);
    border-bottom: 1px solid rgba(117, 94, 56, 0.16);
}

.populationAction {
    flex: 1;
    min-height: 30px;
    border: 1px solid rgba(117, 94, 56, 0.4);
    background: rgba(37, 30, 22, 0.75);
    color: #9e8a67;
    font-family: "Cinzel", Georgia, serif;
    font-size: 7px;
    letter-spacing: 0.8px;
    cursor: pointer;
}

.populationAction:active {
    background: rgba(88, 66, 38, 0.7);
    transform: scale(0.98);
}

.populationAction:disabled {
    opacity: 0.3;
    cursor: default;
}


/* =====================================================
   РЕСУРСЫ
===================================================== */

.resourcesSection {
    position: relative;
    z-index: 2;
}

.resourceCategory {
    border-bottom: 1px solid rgba(117, 94, 56, 0.25);
}

.resourceCategory:last-child {
    border-bottom: none;
}

.resourceCategoryHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 48px;
    padding: 9px 13px;
    border: none;
    outline: none;
    background: transparent;
    color: #bca57b;
    font-family: "Cinzel", Georgia, serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
    text-align: left;
}

.resourceCategoryHeader:active {
    background: rgba(75, 58, 35, 0.18);
}

.resourceCategoryLeft {
    display: flex;
    align-items: center;
    gap: 9px;
}

.resourceCategoryIcon {
    font-size: 16px;
}

.resourceCategoryArrow {
    color: #94784c;
    font-size: 12px;
    transition: transform 0.25s ease;
}

.resourceCategory.open .resourceCategoryArrow {
    transform: rotate(180deg);
}

.resourceCategoryContent {
    display: none;
    padding: 0 9px 9px;
}

.resourceCategory.open .resourceCategoryContent {
    display: block;
}


/* =====================================================
   РЕСУРС
===================================================== */

.resourceItem {
    display: grid;
    grid-template-columns: 42px 1fr auto 34px;
    align-items: center;
    gap: 9px;
    min-height: 62px;
    padding: 8px 9px;
    border: 1px solid rgba(117, 94, 56, 0.36);
    background: rgba(28, 23, 18, 0.68);
}

.resourceItemIcon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(117, 94, 56, 0.42);
    color: #aa9162;
    font-size: 18px;
}

.resourceItemInfo {
    min-width: 0;
}

.resourceItemName {
    color: #c8baa2;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    letter-spacing: 1px;
}

.resourceItemDescription {
    margin-top: 3px;
    color: #6e665a;
    font-size: 10px;
}

.resourceItemValue {
    min-width: 45px;
    color: #d1c3a9;
    font-family: "Cinzel", Georgia, serif;
    font-size: 15px;
    text-align: right;
}

.resourceInfoButton {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(142, 116, 70, 0.55);
    background: rgba(36, 29, 21, 0.75);
    color: #b29667;
    font-family: Georgia, serif;
    font-size: 13px;
    cursor: pointer;
}

.resourceInfoButton:active {
    background: rgba(91, 68, 38, 0.75);
    transform: scale(0.94);
}


/* =====================================================
   ПРОИЗВОДСТВО
===================================================== */

.productionHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 50px;
    padding: 10px 13px;
    border: none;
    background: transparent;
    color: #bca57b;
    font-family: "Cinzel", Georgia, serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
    text-align: left;
}

.productionHeader:active {
    background: rgba(75, 58, 35, 0.18);
}

.productionHeaderLeft {
    display: flex;
    align-items: center;
    gap: 9px;
}

.productionHeaderIcon {
    font-size: 16px;
}

.productionArrow {
    color: #94784c;
    font-size: 13px;
    transition: transform 0.25s ease;
}

.productionSection.open .productionArrow {
    transform: rotate(180deg);
}

.productionMenu {
    display: none;
    border-top: 1px solid rgba(117, 94, 56, 0.32);
}

.productionSection.open .productionMenu {
    display: block;
}

.productionCard {
    margin: 10px;
    padding: 12px;
    border: 1px solid rgba(157, 126, 72, 0.42);
    background: rgba(26, 22, 17, 0.65);
}

.productionTop {
    display: flex;
    align-items: center;
    gap: 10px;
}

.productionIcon {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(117, 94, 56, 0.45);
    font-size: 22px;
}

.productionTitle {
    color: #cbb99a;
    font-family: "Cinzel", Georgia, serif;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.productionSubtitle {
    margin-top: 3px;
    color: #736a5e;
    font-size: 11px;
}

.productionInfo {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(117, 94, 56, 0.25);
}

.productionLine {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    color: #85796a;
    font-size: 12px;
}

.productionLine strong {
    color: #b8a27a;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    text-align: right;
}

.productionStatus {
    margin-top: 9px;
    padding: 9px;
    border: 1px solid rgba(117, 94, 56, 0.28);
    background: rgba(10, 9, 7, 0.4);
    color: #8c7d68;
    font-size: 11px;
    line-height: 1.4;
    text-align: center;
}

.productionStatus.locked {
    color: #876f60;
    border-color: rgba(112, 77, 61, 0.42);
    background: rgba(64, 37, 28, 0.16);
}

.hunterControl {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
}

.hunterButton {
    width: 40px;
    height: 36px;
    border: 1px solid rgba(142, 116, 70, 0.55);
    background: rgba(37, 30, 22, 0.8);
    color: #b69a68;
    font-size: 18px;
    cursor: pointer;
}

.hunterButton:active {
    transform: scale(0.94);
    background: rgba(82, 61, 35, 0.75);
}

.hunterButton:disabled {
    opacity: 0.25;
    cursor: default;
}

.hunterCount {
    flex: 1;
    text-align: center;
}

.hunterCountNumber {
    color: #d0c0a5;
    font-family: "Cinzel", Georgia, serif;
    font-size: 17px;
}

.hunterCountText {
    margin-top: 2px;
    color: #70675b;
    font-size: 10px;
}

.forestBar {
    margin-top: 10px;
}

.forestBarLabel {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    color: #746b5d;
    font-size: 10px;
}

.forestBarOuter {
    width: 100%;
    height: 5px;
    background: rgba(45, 39, 30, 0.8);
}

.forestBarInner {
    width: 100%;
    height: 100%;
    background: #77633f;
    transition: width 0.4s ease;
}

.noForest {
    margin-top: 10px;
    padding: 12px 10px;
    border: 1px solid rgba(112, 77, 61, 0.42);
    background: rgba(64, 37, 28, 0.15);
    color: #89766a;
    font-size: 12px;
    line-height: 1.45;
    text-align: center;
}

.noForestIcon {
    display: block;
    margin-bottom: 5px;
    font-size: 20px;
}

.noForestTitle {
    margin-bottom: 4px;
    color: #a28a72;
    font-family: "Cinzel", Georgia, serif;
    font-size: 9px;
    letter-spacing: 1.5px;
}


/* =====================================================
   ДЕРЕВНЯ
===================================================== */

.village {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 15px 13px 13px;
    border: 1px solid rgba(157, 126, 72, 0.5);
    background: rgba(29, 24, 18, 0.7);
    text-align: center;
    color: inherit;
    font: inherit;
    cursor: pointer;
}

.village:active {
    background: rgba(58, 46, 29, 0.78);
    transform: scale(0.995);
}

.villageTitle {
    color: #cdbb9d;
    font-family: "Cinzel", Georgia, serif;
    font-size: 13px;
    letter-spacing: 2px;
}

.villageText {
    margin-top: 7px;
    color: #7e7569;
    font-size: 13px;
    line-height: 1.4;
}

.villageMapHint {
    margin-top: 11px;
    color: #a58b60;
    font-family: "Cinzel", Georgia, serif;
    font-size: 8px;
    letter-spacing: 1.8px;
}


/* =====================================================
   ЛЕТОПИСЬ
===================================================== */

.history {
    position: relative;
    z-index: 2;
    margin-top: 18px;
    padding: 14px 13px;
    border: 1px solid rgba(117, 94, 56, 0.35);
    background: rgba(20, 17, 14, 0.5);
}

.historyTitle {
    color: #a99168;
    font-family: "Cinzel", Georgia, serif;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.historyText {
    margin-top: 7px;
    color: #908474;
    font-size: 14px;
    line-height: 1.5;
}


/* =====================================================
   ОКНО ИНФОРМАЦИИ
===================================================== */

#helpOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    padding: 20px;
    background: rgba(0, 0, 0, 0.72);
    align-items: center;
    justify-content: center;
}

.helpWindow {
    width: 100%;
    max-width: 360px;
    padding: 23px 18px 18px;
    border: 1px solid rgba(174, 141, 82, 0.65);
    background: #110e0a;
    box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65);
}

.helpWindowTitle {
    color: #d3c2a3;
    font-family: "Cinzel", Georgia, serif;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
}

.helpWindowDivider {
    width: 130px;
    h
