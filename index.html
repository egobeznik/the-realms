<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Realms</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #11100e;
            color: #e8dfcf;
            font-family: Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .game {
            padding: 30px;
        }

        .symbol {
            font-size: 60px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 6px;
        }

        p {
            color: #9d927e;
        }

        .id {
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #756b59;
            color: #c9b99d;
        }
    </style>
</head>

<body>

<div class="game">

    <div class="symbol">♜</div>

    <h1>THE REALMS</h1>

    <p>ЛЕТОПИСЬ НАЧИНАЕТСЯ ЗДЕСЬ</p>

    <div class="id" id="user">
        Проверка Telegram...
    </div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;

    const ALLOWED_USER_ID = 8608712290;


    if (!user) {

        document.getElementById("user").innerHTML =
            "Игра должна быть открыта через Telegram.";

    } else if (user.id !== ALLOWED_USER_ID) {

        document.getElementById("user").innerHTML =
            "🔒<br><br>" +
            "ЗАКРЫТОЕ ТЕСТИРОВАНИЕ" +
            "<br><br>" +
            "Доступ к игре ограничен.";

    } else {

        document.getElementById("user").innerHTML =
            "Добро пожаловать, " +
            user.first_name +
            "<br><br>" +
            "Доступ разрешён";

    }

</script>

</body>
</html>
