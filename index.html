<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>The Realms</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;
        }


        /* =====================================
           ОСНОВНОЙ ЭКРАН
        ===================================== */

        #game {
            position: relative;

            width: 100vw;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #000;
        }


        /* =====================================
           ИЗОБРАЖЕНИЕ
        ===================================== */

        #background {

            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            display: block;

            user-select: none;
            -webkit-user-drag: none;
        }


        /* =====================================
           ПРОЗРАЧНАЯ КНОПКА
        ===================================== */

        #startButton {

            position: absolute;

            /*
             * Положение кнопки рассчитано
             * под твой макет 1152 × 2048.
             *
             * top: 87.0%
             */

            top: 87.0%;
            left: 50%;

            transform: translate(-50%, -50%);

            /*
             * Размер области нажатия.
             */

            width: 46%;
            height: 6.5%;

            border: none;
            outline: none;

            background: transparent;

            cursor: pointer;

            padding: 0;

            /*
             * Невидимая кнопка.
             * Для отладки можно временно
             * заменить transparent на rgba(...).
             */
        }


        /* =====================================
           ЭФФЕКТ НАЖАТИЯ
        ===================================== */

        #startButton:active {

            transform:
                translate(-50%, -50%)
                scale(0.97);
        }


        /* =====================================
           ЭКРАН БЛОКИРОВКИ
        ===================================== */

        #locked {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            background: #090806;

            color: #d8ccb8;

            align-items: center;
            justify-content: center;

            text-align: center;

            font-family: Georgia, serif;
        }


        .lockedContent {

            padding: 30px;

            max-width: 320px;
        }


        .lockedIcon {

            font-size: 42px;

            margin-bottom: 20px;
        }


        .lockedTitle {

            font-size: 17px;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }


        .lockedText {

            color: #777064;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================
           СЛЕДУЮЩИЙ ЭКРАН
           Пока заглушка.
        ===================================== */

        #nextScreen {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 50;

            background: #090806;

            color: #d8ccb8;

            align-items: center;
            justify-content: center;

            text-align: center;

            font-family: Georgia, serif;
        }


        .nextTitle {

            font-size: 25px;

            letter-spacing: 4px;
        }

    </style>

</head>


<body>


    <!-- =====================================
         ИГРА
    ===================================== -->

    <main id="game">

        <!-- ТВОЙ ГОТОВЫЙ ДИЗАЙН -->

        <img
            id="background"
            src="intro.jpg"
            alt="The Realms"
        >


        <!--

            ЭТО НЕВИДИМАЯ НАСТОЯЩАЯ КНОПКА.

            Пользователь видит кнопку
            на картинке.

            Но фактически нажимает
            вот этот HTML-элемент.

        -->

        <button
            id="startButton"
            aria-label="Начать летопись"
            onclick="startChronicle()"
        ></button>

    </main>


    <!-- =====================================
         СЛЕДУЮЩИЙ ЭКРАН
    ===================================== -->

    <section id="nextScreen">

        <div>

            <div class="nextTitle">
                АКТ ОСНОВАНИЯ
            </div>

        </div>

    </section>


    <!-- =====================================
         ЭКРАН БЛОКИРОВКИ
    ===================================== -->

    <section id="locked">

        <div class="lockedContent">

            <div class="lockedIcon">
                ♜
            </div>

            <div class="lockedTitle">
                ЗАКРЫТОЕ ТЕСТИРОВАНИЕ
            </div>

            <div class="lockedText">
                Эта летопись ещё не открыта
                для других правителей.
            </div>

        </div>

    </section>


    <script>

        /* =====================================
           TELEGRAM MINI APP
        ===================================== */

        const tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();


        /* =====================================
           ДОСТУП ТОЛЬКО ДЛЯ ТЕБЯ
        ===================================== */

        const user =
            tg.initDataUnsafe.user;

        const ALLOWED_USER_ID =
            8608712290;


        if (
            !user ||
            Number(user.id) !== ALLOWED_USER_ID
        ) {

            document
                .getElementById("game")
                .style.display = "none";

            document
                .getElementById("locked")
                .style.display = "flex";
        }


        /* =====================================
           НАЧАТЬ ЛЕТОПИСЬ
        ===================================== */

        function startChronicle() {

            /*
             * Пока просто открываем
             * следующий экран.
             *
             * Здесь позже появится
             * настоящее создание Дома.
             */

            document
                .getElementById("game")
                .style.display = "none";

            document
                .getElementById("nextScreen")
                .style.display = "flex";

        }

    </script>


</body>

</html>
